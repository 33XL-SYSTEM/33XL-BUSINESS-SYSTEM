<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="33XL BUSINESS SYSTEM - Plataforma modular de organização, processamento e automação." />
  <meta name="author" content="33XL SYSTEM" />
  <title>33XL BUSINESS SYSTEM</title>
  <link rel="icon" type="image/png" href="/favicons/favicon.png" />
  <link href="https://fonts.cdnfonts.com/css/xirod" rel="stylesheet" />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background-color: #030303;
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- Sleek Minimalist Loading Screen -->
    <div style="
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #030303;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #ffffff;
      user-select: none;
    ">
      <div style="
        font-size: 10px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        margin-bottom: 24px;
        color: #a1a1aa;
        font-weight: bold;
        animation: pulse 1.5s infinite ease-in-out;
      ">
        33XL BUSINESS SYSTEM • INICIANDO
      </div>
      <div style="
        width: 140px;
        height: 2px;
        background-color: rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      ">
        <div style="
          position: absolute;
          left: -100%;
          width: 100%;
          height: 100%;
          background-color: #ffffff;
          animation: loading-bar 1.8s infinite cubic-bezier(0.65, 0.05, 0.36, 1);
        "></div>
      </div>
      <style>
        @keyframes loading-bar {
          0% {
            left: -100%;
          }

          50% {
            left: 0;
          }

          100% {
            left: 100%;
          }
        }

        @keyframes pulse {

          0%,
          100% {
            opacity: 0.5;
          }

          50% {
            opacity: 1;
          }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
